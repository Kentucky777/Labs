<main>

<button id="toTop" title="Наверх">↑</button>

<script src="common.js"></script>
<script>
const news = [
  {date:"15.05.2026", title:"Расширение линейки инструментов",
   preview:"СПБ Биржа сообщила о планах по расширению перечня доступных инструментов для частных инвесторов.",
   full:"СПБ Биржа сообщила о планах по расширению перечня доступных инструментов для частных инвесторов. Новые инструменты должны повысить ликвидность и предоставить инвесторам больше возможностей для диверсификации портфеля. Запуск планируется поэтапно в течение года."},
  {date:"28.04.2026", title:"Развитие клиринговой инфраструктуры",
   preview:"Компания продолжает модернизацию систем клиринга и расчётов для повышения надёжности торгов.",
   full:"Компания продолжает модернизацию систем клиринга и расчётов для повышения надёжности торгов. Обновление затрагивает технологическую платформу, что должно сократить время обработки сделок и повысить устойчивость к пиковым нагрузкам."},
  {date:"10.04.2026", title:"Итоги торгов за квартал",
   preview:"Биржа опубликовала статистику по объёмам торгов и числу активных счетов за прошедший квартал.",
   full:"Биржа опубликовала статистику по объёмам торгов и числу активных счетов за прошедший квартал. В отчёте отражена динамика по основным категориям инструментов, а также количество зарегистрированных и активных клиентов."},
  {date:"22.03.2026", title:"Технологическое обновление платформы",
   preview:"Введены новые функции в торговый терминал и улучшен пользовательский интерфейс.",
   full:"Введены новые функции в торговый терминал и улучшен пользовательский интерфейс. Обновления направлены на удобство розничных инвесторов: новые виджеты, графики и инструменты анализа."},
  {date:"05.03.2026", title:"Партнёрство с участниками рынка",
   preview:"СПБ Биржа объявила о соглашениях с новыми профессиональными участниками рынка.",
   full:"СПБ Биржа объявила о соглашениях с новыми профессиональными участниками рынка. Сотрудничество расширяет круг брокеров и банков, предоставляющих клиентам доступ к торгам на площадке."},
  {date:"18.02.2026", title:"Образовательные инициативы для инвесторов",
   preview:"Запущена серия обучающих материалов о принципах биржевой торговли и управлении рисками.",
   full:"Запущена серия обучающих материалов о принципах биржевой торговли и управлении рисками. Материалы доступны бесплатно и ориентированы на начинающих частных инвесторов."},
  {date:"30.01.2026", title:"Раскрытие финансовой отчётности",
   preview:"Опубликована отчётность эмитента в соответствии с требованиями регулятора.",
   full:"Опубликована отчётность эмитента в соответствии с требованиями регулятора. Документы доступны в разделе раскрытия информации на официальном сайте компании."},
  {date:"14.01.2026", title:"Расширение времени торгов",
   preview:"Биржа сообщила об увеличении торговых сессий для удобства инвесторов в разных часовых поясах.",
   full:"Биржа сообщила об увеличении торговых сессий для удобства инвесторов в разных часовых поясах. Это позволяет участникам реагировать на рыночные события в более широком временном диапазоне."},
  {date:"20.12.2025", title:"Итоги года",
   preview:"Подведены ключевые итоги работы биржи за прошедший год.",
   full:"Подведены ключевые итоги работы биржи за прошедший год. Отмечены основные достижения в области технологий, привлечения клиентов и развития инфраструктуры рынка."},
  {date:"02.12.2025", title:"Меры по защите инвесторов",
   preview:"Внедрены дополнительные механизмы контроля рисков и защиты средств клиентов.",
   full:"Внедрены дополнительные механизмы контроля рисков и защиты средств клиентов. Усиление процедур направлено на повышение доверия со стороны розничных и институциональных участников."},
];

const grid = document.getElementById('newsGrid');
news.forEach((n, i) => {
  const card = document.createElement('div');
  card.className = 'news-card';
  card.innerHTML = `
    <div class="date">${n.date}</div>
    <h3>${n.title}</h3>
    <div class="preview">${n.preview}</div>
    <div class="full" id="full-${i}">${n.full}</div>
    <button data-i="${i}">Показать полностью</button>`;
  grid.appendChild(card);
});

grid.addEventListener('click', e => {
  if (e.target.tagName !== 'BUTTON') return;
  const i = e.target.dataset.i;
  const full = document.getElementById('full-' + i);
  const prev = e.target.previousElementSibling.previousElementSibling; // .preview
  const open = full.style.display === 'block';
  full.style.display = open ? 'none' : 'block';
  prev.style.display = open ? 'block' : 'none';
  e.target.textContent = open ? 'Показать полностью' : 'Скрыть';
});
</script>
</body>
</html>
