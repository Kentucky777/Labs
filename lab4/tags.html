    <style>
        main {
            position: relative;
            min-height: 600px;
            overflow: hidden;
        }

        .tag {
            position: absolute;
            display: inline-block;
            text-decoration: none;
            font-family: Arial, sans-serif;
            white-space: nowrap;
            transition: box-shadow 0.2s ease;
            z-index: 1;
            background: transparent;
            border: none;
            padding: 0;
            animation-duration: 8s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }

        .tag:hover {
            animation-play-state: paused !important;
            transform: scale(1.4) rotate(0deg) !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 100 !important;
            background: transparent;
        }
        .tag-1 {
            color: #e74c3c;
            font-size: 20px;
            animation-name: float1;
        }
        @keyframes float1 {
            0% { top: 5%; left: 5%; transform: rotate(-8deg); }
            25% { top: 8%; left: 12%; transform: rotate(-3deg); }
            50% { top: 3%; left: 8%; transform: rotate(-10deg); }
            75% { top: 10%; left: 3%; transform: rotate(-5deg); }
            100% { top: 5%; left: 5%; transform: rotate(-8deg); }
        }

        .tag-2 {
            color: #2980b9;
            font-size: 28px;
            animation-name: float2;
        }
        @keyframes float2 {
            0% { top: 15%; right: 10%; transform: rotate(12deg); }
            25% { top: 20%; right: 15%; transform: rotate(8deg); }
            50% { top: 12%; right: 5%; transform: rotate(15deg); }
            75% { top: 18%; right: 12%; transform: rotate(10deg); }
            100% { top: 15%; right: 10%; transform: rotate(12deg); }
        }

        .tag-3 {
            color: #27ae60;
            font-size: 16px;
            animation-name: float3;
        }
        @keyframes float3 {
            0% { top: 30%; left: 8%; transform: rotate(-5deg); }
            25% { top: 35%; left: 15%; transform: rotate(0deg); }
            50% { top: 28%; left: 5%; transform: rotate(-8deg); }
            75% { top: 33%; left: 12%; transform: rotate(-2deg); }
            100% { top: 30%; left: 8%; transform: rotate(-5deg); }
        }

        .tag-4 {
            color: #8e44ad;
            font-size: 32px;
            animation-name: float4;
        }
        @keyframes float4 {
            0% { top: 45%; right: 15%; transform: rotate(7deg); }
            25% { top: 50%; right: 20%; transform: rotate(12deg); }
            50% { top: 42%; right: 10%; transform: rotate(5deg); }
            75% { top: 48%; right: 18%; transform: rotate(10deg); }
            100% { top: 45%; right: 15%; transform: rotate(7deg); }
        }

        .tag-5 {
            color: #d35400;
            font-size: 22px;
            animation-name: float5;
        }
        @keyframes float5 {
            0% { bottom: 25%; left: 12%; transform: rotate(-12deg); }
            25% { bottom: 30%; left: 18%; transform: rotate(-8deg); }
            50% { bottom: 22%; left: 8%; transform: rotate(-15deg); }
            75% { bottom: 28%; left: 15%; transform: rotate(-10deg); }
            100% { bottom: 25%; left: 12%; transform: rotate(-12deg); }
        }

        .tag-6 {
            color: #1abc9c;
            font-size: 18px;
            animation-name: float6;
        }
        @keyframes float6 {
            0% { top: 60%; right: 25%; transform: rotate(15deg); }
            25% { top: 55%; right: 30%; transform: rotate(20deg); }
            50% { top: 65%; right: 20%; transform: rotate(12deg); }
            75% { top: 58%; right: 28%; transform: rotate(18deg); }
            100% { top: 60%; right: 25%; transform: rotate(15deg); }
        }

        .tag-7 {
            color: #e67e22;
            font-size: 26px;
            animation-name: float7;
        }
        @keyframes float7 {
            0% { bottom: 40%; left: 25%; transform: rotate(-20deg); }

            50% { top: 48%; left: 50%; transform: rotate(-18deg); }
            75% { top: 53%; left: 58%; transform: rotate(-12deg); }
            100% { top: 50%; left: 55%; transform: rotate(-15deg); }
        }

        .tag-12 {

            animation-name: float12;

        @keyframes float12 {
            0% { bottom: 55%; right: 45%; transform: rotate(8deg); }
