<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байков Никита Дмитриевич. Лабораторная 5</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <style>
        .cart-box {
            border: 1px solid #aaa;
            border-radius: 15px;
            display: inline-block;
            padding: 10px 20px 20px 20px;
            min-width: 260px;
        }
        .cart-box h2 {
            margin: 10px 0 16px 0;
            text-align: center;
        }
        .cart-row {
            margin-bottom: 10px;
        }
        .cart-row label {
            display: block;
            margin-bottom: 4px;
        }
        .cart-row input[type="number"] {
            width: 100%;
            padding: 4px 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .cart-buttons {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }
        .cart-buttons input[type="button"] {
            padding: 6px 16px;
            cursor: pointer;
            font-size: 14px;
        }
        #result {
            margin-top: 12px;
            font-weight: bold;
            display: none;
        }
    </style>
    <script>
        const PRICES = {
            numA: 100,
            numB: 120,
            numC: 130,
            numD: 180,
            numE: 200
        };

        function suM() {
            let total = 0;
            for (const [id, price] of Object.entries(PRICES)) {
                const input = document.getElementById(id);
                const qty = parseInt(input.value);
                total += (isNaN(qty) || qty < 0) ? 0 : qty * price;
            }
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = 'Общая стоимость: ' + total + ' р.';
            resultDiv.style.display = 'block';
        }

        function clearCart() {
            for (const id of Object.keys(PRICES)) {
                document.getElementById(id).value = '';
            }
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = '';
            resultDiv.style.display = 'none';
        }
    </script>
</head>
<body>
    <header>
        НГТУ, ФБ, Лабораторная 5
    </header>
    <main>
        <div class="cart-box">
            <h2>Корзина товаров</h2>

            <div class="cart-row">
                <label for="numA">Яблоки (100 р/шт):</label>
                <input type="number" id="numA" min="0" placeholder="сколько яблок?">
            </div>

            <div class="cart-row">
                <label for="numB">Апельсины (120 р/шт):</label>
                <input type="number" id="numB" min="0" placeholder="сколько апельсинов?">
            </div>

            <div class="cart-row">
                <label for="numC">Груши (130 р/шт):</label>
                <input type="number" id="numC" min="0" placeholder="сколько груш?">
            </div>

            <div class="cart-row">
                <label for="numD">Сливы (180 р/шт):</label>
                <input type="number" id="numD" min="0" placeholder="сколько слив?">
            </div>

            <div class="cart-row">
                <label for="numE">Бананы (200 р/шт):</label>
                <input type="number" id="numE" min="0" placeholder="сколько бананов?">
            </div>

            <div class="cart-buttons">
                <input type="button" value="Рассчитать" onclick="suM()">
                <input type="button" value="Очистить"   onclick="clearCart()">
            </div>

            <div id="result"></div>
        </div>
    </main>

    <footer>
        &copy; Байков Никита, ФБИ-41, 2 курс, 2026
    </footer>
</body>
</html>
