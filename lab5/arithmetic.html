<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байков Никита Дмитриевич. Лабораторная 5</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <script>
        function showSum(){
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a+b
            alert(' Сумма ' + a +' и '+ b + ' равна ' + result);
        }
        function showAuthor(){
            let author = 'Автор страницы: \nБайков Никита Дмитриевич'
            alert(author);
        }
        function showhi(){
            alert('Счастья вам!');
        }
        function showDiff(){
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a-b
            alert('Разность ' + a + ' и ' + b + ' равна ' + result);
        }
        function showMulti(){
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a*b
            alert('Произведение ' + a + ' и ' + b + ' равна ' + result);
        }
    </script>
    <style>
        .message{
            cursor: pointer;
            width: 210px;
            height: 20px;
            background-color: bisque;
            color: black;
            border: 5px solid red;
            border-radius: 10px;
            display: inline-block;
            text-align: center;
        }
    </style>
</head>
<body>
    <header onclick="showAuthor()">
        НГТУ, ФБ, Лабораторная 5
    </header>
    <main>
        <label>Первое число: <input type="number" value="5154" id="numberA"></label><br>
        <label> Второе число: <input type="number" value="7891" id="numberB"></label><br>
        <div class="message" onclick="showSum()">Найти сумму чисел</div>
        <div class="message"onclick="showAuthor()">Узнать кто автор страницы</div>
        <div class="message" onclick="showDiff()">Найти разность чисел</div>
        <div class="message" onclick="showMulti()">Найти произведение чисел</div>
    </main>

    <footer style="cursor: pointer;" ondblclick="showhi()">
        &copy; Байков Никита, ФБИ-41, 2 курс, 2026
    </footer>
    
</body>
</html>
