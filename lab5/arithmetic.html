<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байков Никита Дмитриевич. Лабораторная 5</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <script>
        function showSum(){
            let inputA = document.getElementById('numberA');
            let inputB = document.getElementById('numberB');

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a+b
            alert(' Сумма ' + a +' и '+ b + ' равна ' + result);
        }
        function showAuthor(){
            let author = 'Автор страницы: \nБайков Никита Дмитриевич'
            alert(author);
        }
        function showhi(){
            alert('Счастья вам!');
        }
        function showDiff(){
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a-b
            alert('Разность ' + a + ' и ' + b + ' равна ' + result);
        }
        function showMulti(){
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a*b
            alert('Произведение ' + a + ' и ' + b + ' равна ' + result);
        }
        function showDiv(){
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a/b
            if (isNaN(a)){
                alert('Введите значение в первое поле');
                inputA.focus()
                inputA.select()
                inputA.style.color = 'red';
                inputA.style.borderColor = 'red';
                return
            }
            if (isNaN(b)){
                alert('Введите значение во второе поле');
                inputB.focus()
                inputB.select()
                inputB.style.color = 'red';
                inputB.style.borderColor = 'red';
                return
            }
            if (b == 0){
                alert('На ноль делить нельзя!')
                inputB.focus()
                inputB.select()
                inputB.style.color = 'red';
                inputB.style.borderColor = 'red';
                return
            }
            inputB.style.color='';
            inputB.style.borderColor = '';
            alert('Деление' + a + ' и ' + b  + ' равно ' + result)
        }
        function showVoz(){
            let inputA = document.getElementById('numberA')
            let inputB = document.getElementById('numberB')

            let a = parseInt(inputA.value)
            let b = parseInt(inputB.value)
            let result = a**b
            if (isNaN(a)){
                alert('Введите значение в первое поле');
                inputA.focus()
                inputA.select()
                inputA.style.color = 'red';
                inputA.style.borderColor = 'red';
                return
            }
            if (isNaN(b)){
                alert('Введите значение во второе поле');
                inputB.focus()
                inputB.select()
                inputB.style.color = 'red';
                inputB.style.borderColor = 'red';
                return
            }
            if (b == 0 && a == 0){
                alert('Ноль в нулевую нельзя возводить!')
                inputA.focus()
                inputA.select()
                inputA.style.color = 'red';
                inputA.style.borderColor = 'red';
                inputB.focus()
                inputB.select()
                inputB.style.color = 'red';
                inputB.style.borderColor = 'red';
                return
            }
            inputB.style.color='';
            inputB.style.borderColor = '';
            alert('Возведение ' + a + ' и ' + b  + ' равно ' + result)
        }
        function changeOut(buttonNum, backColor, txtColor, b, bWidth, bRad){
            let output = document.getElementById('output')
            output.innerHTML = 'Нажата кнопка ' + buttonNum
            output.style.backgroundColor = backColor
            output.style.color = txtColor
            output.style.border = b
            output.style.borderWidth = bWidth
            output.style.borderRadius = bRad
        }
    </script>
    <style>
        .message{
            cursor: pointer;
            width: 210px;
            height: 20px;
            background-color: bisque;
            color: black;
            border: 5px solid red;
            border-radius: 10px;
            display: inline-block;
            text-align: center;
        }
        #output{
            border: 1px solid;
            width: 300px;
            height: 40px;
        }
    </style>
</head>
<body>
    <header onclick="showAuthor()">
        НГТУ, ФБ, Лабораторная 5
    </header>
    <main>
        <label>Первое число: <input type="number" value="5154" id="numberA"></label><br>
        <label> Второе число: <input type="number" value="7891" id="numberB"></label><br>
        <div class="message" onclick="showSum()">Найти сумму чисел</div>
        <div class="message"onclick="showAuthor()">Узнать кто автор страницы</div>
        <div class="message" onclick="showDiff()">Найти разность чисел</div>
        <div class="message" onclick="showMulti()">Найти произведение чисел</div>
        <div class="message" onclick="showDiv()">Найти отношение чисел</div>
        <div class="message" onclick="showVoz()">Возвести число в степень</div>

        <div>
            <input type="button" value="Кнопка 1" onclick="changeOut(1, 'red', 'yellow', 'solid', 3, 10)">
            <input type="button" value="Кнопка 2" onclick="changeOut(2, 'black', 'lime', 'dotted', 5, 15)">
            <input type="button" value="Кнопка 3" onclick="changeOut(3, 'black', 'white', 'solid', 5, 50)">
            <input type="button" value="Кнопка 4" onclick="changeOut(4, 'white', 'black', 'dashed', 4, 15)">
        </div>
        <div id="output"></div>
    </main>

    <footer style="cursor: pointer;" ondblclick="showhi()">
        &copy; Байков Никита, ФБИ-41, 2 курс, 2026
    </footer>
    
</body>
</html>
