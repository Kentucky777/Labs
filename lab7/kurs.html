<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байков Никита Дмитриевич. Лабораторная 6</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <script src ="kurs-data.js"></script>
    <script>
        function showExchange() {
            let table = document.getElementById('dollar-table');

            let caption = document.createElement('caption');
            caption.innerText = 'Курс акций ПИК-Специализированный застройщик';
            table.appendChild(caption);

            let headerRow = document.createElement('tr');
            ['Дата', 'Цена, руб', 'Изменение'].forEach(text => {
                let th = document.createElement('th');
                th.innerText = text;
                headerRow.appendChild(th);
            });
            table.appendChild(headerRow);

            for (let i = 0; i < exchange.length; i++) {
                let tr = document.createElement('tr');

                let tdDate = document.createElement('td');
                tdDate.innerText = date[i];
                tr.appendChild(tdDate);

                let tdPrice = document.createElement('td');
                tdPrice.innerText = exchange[i];
                tr.appendChild(tdPrice);

                let tdDiff = document.createElement('td');
                if (i === 0) {
                    tdDiff.innerText = '—';
                } else {
                    let diff = (exchange[i] - exchange[i - 1]).toFixed(2);
                    tdDiff.innerText = diff > 0 ? '+' + diff : diff;
                    if (diff > 0) tdDiff.style.color = 'green';
                    else if (diff < 0) tdDiff.style.color = 'red';
                }
                tr.appendChild(tdDiff);

                table.appendChild(tr);
            }

            let sum = 0;
            for (let i = 0; i < exchange.length; i++) sum += exchange[i];
            let average = Math.round(sum / exchange.length);
            let min = Math.min(...exchange);
            let max = Math.max(...exchange);

            let detail = document.getElementById('detail');
            detail.innerHTML =
                'Среднее значение: ' + average + ' руб<br>' +
                'Минимальное значение: ' + min + ' руб<br>' +
                'Максимальное значение: ' + max + ' руб';

            document.getElementById('btn').disabled = true;
        }
    </script>
</head>
<body>
    <header>
        НГТУ, ФБ, Лабораторная 6
    </header>
    <main>
        <button onclick="showExchange()" id ="btn">Курс акций</button>
        <table border ="1" id ="dollar-table"></table>
        <div id="detail"></div>
    </main>

    <footer>
        &copy; Байков Никита, ФБИ-41, 2 курс, 2026
    </footer>
    
</body>
</html>
