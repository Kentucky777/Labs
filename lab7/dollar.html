<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байков Никита Дмитриевич. Лабораторная 6</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <script src ="dollar-data.js"></script>
    <script>
        function showExchange(){
            let table = document.getElementById('dollar-table');
            for(let i = 0; i < exchange.length; i++){
                let tr = document.createElement('tr');
                let td = document.createElement('td');
                td.innerText = exchange[i];
                tr.appendChild(td);
                table.appendChild(tr);
            }
            
            let sum = 0;
            for(let i = 0; i < exchange.length; i++){
                sum += exchange[i];
            }
            let average = (sum/exchange.length).toFixed(2);
            document.getElementById('detail').innerText = 'Среднее значение ' + average;
            document.getElementById('btn').disabled = true;
        }
    </script>
</head>
<body>
    <header>
        НГТУ, ФБ, Лабораторная 6
    </header>
    <main>
        <button onclick="showExchange()" id ="btn">Курс доллара</button>
        <table border ="1" id ="dollar-table"></table>
        <div id="detail"></div>
    </main>

    <footer>
        &copy; Байков Никита, ФБИ-41, 2 курс, 2026
    </footer>
    
</body>
</html>
