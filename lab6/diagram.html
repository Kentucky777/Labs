<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байков Никита Дмитриевич. Лабораторная 6</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <script>
        function showDiagram(){
            let data = [36, 86, 55, 28, 92, 60, 41, 17, 9, 43];
            let colors = ['red','green','#00ff33', 'blue', '#d98cf5', '#288a5a','#b9f071','#8a086e','#cc5268','#1f751d']
            let bars = document.getElementsByClassName('bar');
            const diagWidth = document.getElementById('diag').clientHeight;
            const maxData = Math.max(...data);
            const k = diagWidth/maxData * 18;
            for(let i = 0; i < data.length; i++){
                bars[i].style.height = k*data[i] + 'px';
                bars[i].style.backgroundColor = colors[i];
                bars[i].innerHTML = data[i];
            }
        } 
    </script>
    <style>
        #diag{
            display:flex;
            align-items: flex-end;
        }
        .bar{
            background-color: blue;
            border-bottom: 1px solid cyan;
            width: 200px;
            height: 40px;
            box-sizing: border-box;
            color:black
        }
    </style>
</head>
<body onload="showDiagram()">
    <header>
        НГТУ, ФБ, Лабораторная 6
    </header>
    <main>
        <div id="diag">
            <div class="bar"></div>

            <div class="bar"></div>
        </div>
    </main>

    </footer>
    
</body>
</html>
