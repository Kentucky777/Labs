<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Байков Никита Дмитриевич. Лабораторная 6</title>
    <link rel="stylesheet" href="../main.css">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="icon" href="../favicon-16x16.png">
    <link rel="icon" href="../favicon-32x32.png">
    <script>
        function buildTable(multiplier, from, to) {
            let tbl = document.getElementById('mtable');
            tbl.innerHTML = '<h1>Таблица умножения</h1>';

            let start = from, end = to;
            if (start > end) {
                let tmp = start; start = end; end = tmp;
            }

            for (let i = start; i <= end; i++) {
                let d = document.createElement('div');
                d.textContent = i + ' * ' + multiplier + ' = ' + (i * multiplier);
                tbl.appendChild(d);
            }
        }

        function showMultipletable() {
            buildTable(7, 1, 10);
        }

        function onTableClick() {
            let multVal = parseInt(document.getElementById('inp-mult').value);
            let fromVal = parseInt(document.getElementById('inp-from').value);
            let toVal   = parseInt(document.getElementById('inp-to').value);

            buildTable(multVal, fromVal, toVal);
        }
    </script>
</head>
<body onload="showMultipletable()">
    <header>
        НГТУ, ФБ, Лабораторная 6
    </header>
    <main>
        <div id="mtable"></div>

        <hr>

        <div class="controls">
            <p><label for="inp-mult">Умножить на:</label><input id="inp-mult" type="number" value="7"></p>
            <p><label for="inp-from">Начать с:</label><input id="inp-from" type="number" value="1"></p>
            <p><label for="inp-to">Закончить на:</label><input id="inp-to" type="number" value="10"></p>
            <p><button onclick="onTableClick()">Таблица</button></p>
            <p class="err"></p>
        </div>
    </main>

    <footer>
        &copy; Байков Никита, ФБИ-41, 2 курс, 2026
    </footer>

</body>
</html>
